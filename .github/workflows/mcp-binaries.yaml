name: "MCP binaries"

# Builds the OnyxMCP bridge for Linux, on Linux.
#
# Onyx.app ships these inside its bundle so it can install the bridge on
# any remote host in one click. They can't be built on the Mac that
# packages the app: cross-compiling Swift to Linux needs the swift.org
# toolchain plus a static SDK, and Xcode's Swift can't use those SDKs —
# it fails with "compiled module was created by a different version of
# the compiler". Building where the binary will run avoids that entirely.
#
# Both architectures are built natively rather than under emulation, so
# an arm64 build is a real arm64 build rather than a slow qemu one.
#
# The binaries are attached to a release when the tag exists, and are
# always uploaded as workflow artifacts so `package.sh` can fetch them
# for an unreleased build.

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - master
    paths:
      # Only the bridge and its manifest affect these outputs.
      - 'Sources/OnyxMCP/**'
      - 'Package.swift'
      - '.github/workflows/mcp-binaries.yaml'
  pull_request:
    paths:
      - 'Sources/OnyxMCP/**'
      - 'Package.swift'
      - '.github/workflows/mcp-binaries.yaml'

concurrency:
  group: mcp-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm

    container:
      # The official Swift image, so the toolchain matches the one the
      # macOS side builds with rather than whatever the runner ships.
      image: swift:6.1

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release --product OnyxMCP

      # A bridge that can't start is worse than a missing one: the app
      # would install it, report success, and every MCP call would fail
      # later with nothing pointing back here. `--version` exercises
      # startup without needing a socket to talk to.
      - name: Verify it runs
        run: |
          BIN=$(swift build -c release --product OnyxMCP --show-bin-path)/OnyxMCP
          file "$BIN"
          "$BIN" --version

      - name: Stage
        run: |
          BIN=$(swift build -c release --product OnyxMCP --show-bin-path)/OnyxMCP
          mkdir -p dist
          cp "$BIN" "dist/OnyxMCP-${{ matrix.arch }}"
          chmod +x "dist/OnyxMCP-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OnyxMCP-${{ matrix.arch }}
          path: dist/OnyxMCP-${{ matrix.arch }}
          if-no-files-found: error

      # On a tag, attach them to that release so `package.sh` on the Mac
      # can pull them by version instead of hunting through workflow runs.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/OnyxMCP-${{ matrix.arch }}" --clobber --repo "${GITHUB_REPOSITORY}"
