name: "MCP binaries"

# Builds the OnyxMCP bridge for Linux, on Linux.
#
# Onyx.app ships these inside its bundle so it can install the bridge on
# any remote host in one click. They can't be built on the Mac that
# packages the app: cross-compiling Swift to Linux needs the swift.org
# toolchain plus a static SDK, and Xcode's Swift can't use those SDKs —
# it fails with "compiled module was created by a different version of
# the compiler". Building where the binary will run avoids that entirely.
#
# Both architectures are built natively rather than under emulation, so
# an arm64 build is a real arm64 build rather than a slow qemu one.
#
# The binaries are uploaded as workflow artifacts. `package.sh` fetches
# them from here and puts them inside the app bundle, and `release.sh`
# takes them back OUT of the built disk image and attaches them to the
# release — so what a release offers for a Linux host is byte-identical
# to what the app installs.
#
# This workflow used to attach them itself, on a tag push, and it failed
# every time: it ran seconds after the tag existed, while the release is
# created minutes later — the DMG has to be built and notarized first —
# so `gh release upload` had no release to upload to. Four tagged runs
# failed that way and 0.17 shipped with no Linux bridges on it. The
# release is now written by exactly one thing, which is the only way the
# ordering can't be wrong.
#
# Hence no tag trigger either: a tag points at a commit master already
# built, so a tag run would rebuild the same source to no purpose.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      # Only the bridge and what it compiles in affect these outputs.
      # OnyxVersion is one of those: it carries the version and the
      # bridge-protocol number, so a release bump MUST rebuild these or
      # they ship announcing the previous version and every host reports
      # "update available" forever.
      - 'Sources/OnyxMCP/**'
      - 'Sources/OnyxVersion/**'
      - 'Package.swift'
      - '.github/workflows/mcp-binaries.yaml'
  pull_request:
    paths:
      - 'Sources/OnyxMCP/**'
      - 'Sources/OnyxVersion/**'
      - 'Package.swift'
      - '.github/workflows/mcp-binaries.yaml'

concurrency:
  group: mcp-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only: this workflow no longer writes to a release.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm

    container:
      # The official Swift image, so the toolchain matches the one the
      # macOS side builds with rather than whatever the runner ships.
      image: swift:6.1

    steps:
      - uses: actions/checkout@v4

      # --static-swift-stdlib because this binary is installed onto other
      # people's machines. A stock Linux host has no Swift runtime, and a
      # dynamically linked build dies at exec with a missing libswiftCore
      # — which the app would report as "installed but broken" with no
      # hint that the cause is a shared library nobody asked for.
      - name: Build
        run: swift build -c release --static-swift-stdlib --product OnyxMCP

      # A bridge that can't start is worse than a missing one: the app
      # would install it, report success, and every MCP call would fail
      # later with nothing pointing back here. `--version` exercises
      # startup without needing a socket to talk to.
      # Nothing here may assume a tool the swift image doesn't ship: it is
      # a slim Debian with a toolchain, not a workstation. `file` is not in
      # it, which cost a run.
      - name: Verify it runs
        run: |
          BIN=$(swift build -c release --static-swift-stdlib --product OnyxMCP --show-bin-path)/OnyxMCP
          ls -l "$BIN"
          "$BIN" --version

          # Prove the Swift runtime is baked in. If this ever starts
          # listing libswift*, the binary works here and nowhere else.
          if command -v ldd >/dev/null 2>&1; then
            ldd "$BIN" || true
            if ldd "$BIN" 2>/dev/null | grep -q libswift; then
              echo "::error::OnyxMCP links the Swift runtime dynamically; it will not run on a host without Swift"
              exit 1
            fi
          fi

          # --probe exercises the socket paths (which differ on Linux) and
          # must exit 1 here, where there is no Onyx to find. A crash or a
          # false "reachable" is a bug worth catching before install time.
          set +e
          ONYX_MCP_FORWARD_PORT=0 "$BIN" --probe > probe.txt 2>&1
          code=$?
          set -e
          cat probe.txt
          test "$code" = "1" || { echo "::error::--probe should exit 1 with no backend"; exit 1; }
          grep -q "NOT REACHABLE" probe.txt

      - name: Stage
        run: |
          BIN=$(swift build -c release --static-swift-stdlib --product OnyxMCP --show-bin-path)/OnyxMCP
          mkdir -p dist
          cp "$BIN" "dist/OnyxMCP-${{ matrix.arch }}"
          chmod +x "dist/OnyxMCP-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OnyxMCP-${{ matrix.arch }}
          path: dist/OnyxMCP-${{ matrix.arch }}
          if-no-files-found: error

